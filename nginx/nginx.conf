# nginx config for the EzyAgric static site (the out/ folder of `npm run build`).
#
# The Dockerfile copies this file to /etc/nginx/conf.d/default.conf, so it is
# included inside the http {} block of the image's main nginx.conf (which
# already loads mime.types and sets up logging).
#
# TLS and HSTS are expected to be handled by the load balancer / proxy in
# front of this container.

# "Try Ka-Ezy" live answers (README, "Ka-Ezy on the website";
# docs/backend-tickets.md BT-01 and BT-02). Uncomment once
# engineering has a guest demo route on the Ka-Ezy backend, and build the
# image with --build-arg NEXT_PUBLIC_KAEZY_DEMO_API=/api/kaezy-demo. Same
# origin, so no CORS and no change to the Content-Security-Policy. At most
# 6 questions a minute per visitor IP (bursts of 3), on top of the backend's
# own limits. Behind a load balancer, set real_ip_header so $binary_remote_addr
# is the visitor, not the balancer.
# limit_req_zone $binary_remote_addr zone=kaezy_demo:10m rate=6r/m;

# Cache-Control is chosen from the final URI (after index/try_files), so it
# can be set once at server level. Using add_header inside a location would
# silently drop the security headers below for that location.
map $uri $ezy_cache_control {
    # Next.js build files have a content hash in their name: cache for a year.
    ~^/_next/static/       "public, max-age=31536000, immutable";
    # Images keep their names when replaced, so cache for 30 days, not forever.
    ~^/images/             "public, max-age=2592000";
    ~^/videos/             "public, max-age=2592000";
    # Pages, RSC payloads (.txt), sitemap and robots: always revalidate (ETag).
    ~\.(?:html|txt|xml)$   "no-cache";
    default                "public, max-age=3600";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    # Relative Location headers, so redirects keep the visitor's host and port
    # (e.g. localhost:8080) instead of the container's port 80.
    absolute_redirect off;

    error_page 404 /404.html;

    # --- Compression (text/html is always compressed when gzip is on) ------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript text/javascript
               application/json application/manifest+json application/xml image/svg+xml;

    # --- Headers (always = also on 404 and redirect responses) -------------
    add_header Cache-Control $ezy_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Content-Security-Policy, one directive per clause:
    #   script-src  'unsafe-inline' is needed because a Next.js static export
    #               puts the page data in inline <script> tags whose content
    #               changes on every build, and nginx cannot add per-request
    #               nonces to static files. No user input is ever rendered as
    #               HTML, so the remaining XSS risk is low.
    #               googletagmanager.com serves gtag.js (only after consent).
    #   connect-src / img-src  GA4 sends hits to *.google-analytics.com
    #               (www., region1.) and *.analytics.google.com.
    #   style-src   'unsafe-inline' for React style attributes.
    #   frame-src   YouTube videos (privacy-enhanced mode), loaded on tap.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # --- Redirects -----------------------------------------------------------
    # Old links to /index.html (and /<page>/index.html) go to the clean URL.
    # Checked against $request_uri, so nginx's own internal /index.html
    # lookup for "/" does not loop.
    if ($request_uri ~ "^([^?]*/)index\.html(?:\?.*)?$") {
        return 301 $1$is_args$args;
    }
    # Add old-URL redirects for launch here, e.g.
    #   location = /old-page.html { return 301 /new-page/; }

    # --- Files ---------------------------------------------------------------
    # Never serve dotfiles (.git, .env, ...), even if one ends up in the image.
    # Listed before the other regex locations so it always wins.
    location ~ /\. {
        return 404;
    }

    # ...except /.well-known/ (domain verification, Android app links, ACME).
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Uncomment with the limit_req_zone line at the top of this file.
    # location = /api/kaezy-demo {
    #     limit_req zone=kaezy_demo burst=3 nodelay;
    #     limit_req_status 429;
    #     # One photo check: a JPEG of at most 1024px (a few hundred KB) plus the form fields.
    #     client_max_body_size 1m;
    #     proxy_pass https://ezyassistant-api.ezyagric.com/web/demo-query;
    #     proxy_ssl_server_name on;
    #     proxy_set_header Host ezyassistant-api.ezyagric.com;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_read_timeout 120s;
    # }

    # Pages are folders (trailingSlash: true): /ka-ezy/ -> /ka-ezy/index.html.
    # A folder without its slash (/ka-ezy) gets a 301 to /ka-ezy/.
    location / {
        try_files $uri $uri/ =404;
    }

    # Share images (app/**/opengraph-image.tsx) are written without a file
    # extension, so give them the right type. (Next may add a short hash,
    # e.g. opengraph-image-1a2b3c, for images inside route groups.)
    location ~ (?:^|/)opengraph-image(?:-[0-9a-z]+)?$ {
        default_type image/png;
        try_files $uri =404;
    }

    # Next also exports these not-found routes as folders; never serve them as pages.
    location ~ ^/(?:404|_not-found)/?$ {
        return 404;
    }

    # The 404 page is only shown through error_page, always with a 404 status.
    location = /404.html {
        internal;
    }
}
