<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Sample photo for the Ka-Ezy demo (a drawing): a maize leaf with fall
       armyworm damage: ragged holes, see-through patches, droppings and the
       caterpillar, with its pale upside-down Y on the head. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5d88a"/>
      <stop offset=".5" stop-color="#6a9a45"/>
      <stop offset="1" stop-color="#5e4630"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4a8a2a"/>
      <stop offset=".5" stop-color="#69ad3c"/>
      <stop offset="1" stop-color="#86c752"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="leaf"><path d="M-40 236C80 160 240 82 440-46L440 156C268 262 116 362-40 474Z"/></clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".6">
    <circle cx="60" cy="56" r="48" fill="#eef7d6"/>
    <circle cx="200" cy="28" r="30" fill="#d7ecb2"/>
    <circle cx="340" cy="330" r="60" fill="#7a5a3a"/>
    <circle cx="200" cy="400" r="46" fill="#88a85a"/>
  </g>

  <!-- The leaf blade: midrib and parallel veins. -->
  <path d="M-40 236C80 160 240 82 440-46L440 156C268 262 116 362-40 474Z" fill="url(#blade)"/>
  <g clip-path="url(#leaf)" fill="none" stroke-linecap="round">
    <path d="M-40 290C90 210 252 128 440 4" stroke="#3a7220" stroke-width="1.6" opacity=".5"/>
    <path d="M-40 316C94 234 256 150 440 26" stroke="#a4d474" stroke-width="1.3" opacity=".6"/>
    <path d="M-40 404C104 314 264 222 440 104" stroke="#3a7220" stroke-width="1.6" opacity=".5"/>
    <path d="M-40 430C108 338 268 244 440 128" stroke="#a4d474" stroke-width="1.3" opacity=".6"/>
    <path d="M-40 360C98 274 260 186 440 56" stroke="#e4f0c0" stroke-width="9" opacity=".85"/>

    <!-- See-through "windows" where young caterpillars scraped the leaf. -->
    <g fill="#f1f6d6" stroke="#cbdb98" stroke-width="2.5" stroke-linejoin="round" opacity=".95">
      <path d="M40 392l30-20 22 8-8 22-30 10z"/>
      <path d="M352 96l26-12 14 10-16 18-22-2z"/>
      <path d="M262 214l20-8 10 10-14 12z"/>
    </g>

    <!-- Ragged holes with dry brown edges. -->
    <g fill="#3a5a26" stroke="#ab8f52" stroke-width="3.5" stroke-linejoin="round">
      <path d="M148 214l18-26 24 6 8-14 22 10-8 22 14 14-30 14-16-10-20 8z"/>
      <path d="M300 128l22-18 16 8 14-8 10 20-18 12 2 16-24-2-12-14z"/>
      <path d="M60 300l14-12 16 6-2 18-18 6z"/>
      <path d="M390 150l8-14 14 6-6 14z"/>
    </g>
  </g>

  <!-- Droppings like sawdust, on the leaf near the caterpillar's head. -->
  <g transform="translate(-100 30)">
  <g fill="#86643a">
    <circle cx="176" cy="318" r="4"/><circle cx="188" cy="310" r="3.2"/><circle cx="198" cy="322" r="3.6"/>
    <circle cx="168" cy="332" r="3"/><circle cx="208" cy="312" r="2.6"/><circle cx="184" cy="330" r="3.8"/>
    <circle cx="214" cy="326" r="3"/><circle cx="160" cy="320" r="2.4"/>
  </g>
  <g fill="#c9a66c">
    <circle cx="194" cy="332" r="2.6"/><circle cx="176" cy="306" r="2"/><circle cx="206" cy="334" r="2"/><circle cx="222" cy="316" r="1.8"/>
  </g>
  </g>

  <!-- The caterpillar. -->
  <path d="M128 300C178 264 246 240 318 206" fill="none" stroke="#1e170c" stroke-opacity=".35" stroke-width="44" stroke-linecap="round" filter="url(#soft)" transform="translate(5 9)"/>
  <path d="M128 300C178 264 246 240 318 206" fill="none" stroke="#6b5e3c" stroke-width="38" stroke-linecap="round"/>
  <path d="M128 300C178 264 246 240 318 206" fill="none" stroke="#857650" stroke-width="20" stroke-linecap="round" transform="translate(-2 -5)"/>
  <path d="M128 300C178 264 246 240 318 206" fill="none" stroke="#cdbd8a" stroke-width="6" stroke-linecap="round" transform="translate(4 11)"/>
  <g fill="none" stroke="#3e3520" stroke-width="2" stroke-linecap="round" opacity=".75">
    <path d="M135.3 272.3Q148.7 286.3 155.4 304.5"/>
    <path d="M154.7 260.9Q167.3 275.6 173.0 294.2"/>
    <path d="M174.9 250.2Q187.1 265.4 192.0 284.2"/>
    <path d="M196.0 240.0Q207.7 255.5 212.2 274.4"/>
    <path d="M217.8 230.0Q229.2 245.7 233.4 264.7"/>
    <path d="M240.2 220.1Q251.5 235.9 255.5 254.9"/>
    <path d="M263.1 210.0Q274.4 225.8 278.4 244.8"/>
    <path d="M286.3 199.7Q297.8 215.3 302.0 234.3"/>
  </g>
  <g fill="#1d150b">
    <circle cx="146.5" cy="277.1" r="3"/>
    <circle cx="165.6" cy="266.3" r="3"/>
    <circle cx="185.7" cy="256.0" r="3"/>
    <circle cx="206.6" cy="246.1" r="3"/>
    <circle cx="228.3" cy="236.3" r="3"/>
    <circle cx="250.6" cy="226.4" r="3"/>
    <circle cx="273.5" cy="216.4" r="3"/>
    <circle cx="297.5" cy="208.9" r="3.4"/>
    <circle cx="302.5" cy="219.8" r="3.4"/>
    <circle cx="308.3" cy="203.9" r="3.4"/>
    <circle cx="313.4" cy="214.8" r="3.4"/>
  </g>
  <g transform="translate(121.5 304.7) rotate(144.4)">
    <ellipse rx="22" ry="20" fill="#3b2918"/>
    <ellipse cx="-4" cy="-8" rx="9" ry="5" fill="#fff" opacity=".18"/>
    <path d="M11 -10L0 0 11 10M0 0H-13" fill="none" stroke="#f1e6c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
