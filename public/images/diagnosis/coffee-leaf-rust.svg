<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Sample photo for the Ka-Ezy demo (a drawing): coffee leaves with coffee
       leaf rust: orange powdery spots, some joining into larger patches, on
       the underside of a leaf, and pale yellow patches on another. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fa65c"/>
      <stop offset=".6" stop-color="#3b6a2e"/>
      <stop offset="1" stop-color="#243f1d"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#3f8a36"/>
      <stop offset="1" stop-color="#1f5a22"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86ad69"/>
      <stop offset="1" stop-color="#a3c47f"/>
    </linearGradient>
    <radialGradient id="rust">
      <stop offset="0" stop-color="#e8741a"/>
      <stop offset=".55" stop-color="#f29a26"/>
      <stop offset=".8" stop-color="#f6c443"/>
      <stop offset="1" stop-color="#e9dc6c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#f0e27a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f0e27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="front"><path d="M0 0C34 -57 109 -84 170 -79S252 -59 286 -30Q316 -8 340 0Q316 10 286 26S224 77 163 80S34 54 0 0Z"/></clipPath>
    <clipPath id="back"><path d="M0 0C29 -45 93 -65 145 -61S215 -46 244 -23Q270 -6 290 0Q270 8 244 20S191 60 139 63S29 42 0 0Z"/></clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".5">
    <circle cx="70" cy="60" r="52" fill="#d5eab0"/>
    <circle cx="330" cy="70" r="36" fill="#b9d98f"/>
