<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Sample photo for the Ka-Ezy demo (a drawing): a cassava leaf with
       cassava mosaic disease: yellow and pale-green mottling, and narrow,
       bent leaflets, on a red stalk. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3cc7a"/>
      <stop offset=".6" stop-color="#4c7f35"/>
      <stop offset="1" stop-color="#584330"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#357d2b"/>
      <stop offset="1" stop-color="#4f9d3c"/>
    </linearGradient>
    <linearGradient id="stalk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c84d42"/>
      <stop offset="1" stop-color="#8a2d28"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <!-- Mottling: noise turned into irregular yellow and pale-green patches. -->
    <filter id="yellow" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 .93 0 0 0 0 .88 0 0 0 0 .42 7 0 0 0 -3.6"/>
    </filter>
    <filter id="pale" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 .76 0 0 0 0 .86 0 0 0 0 .5 6 0 0 0 -2.9"/>
    </filter>
    <clipPath id="leaflets">
      <path d="M0 0C52 -48 172 -40 260 0C167 35 57 45 0 0Z" transform="translate(200 300) rotate(-90)"/>
      <path d="M0 0C38 -36 86 -13 119 -26S190 -4 238 13C190 13 157 5 124 18S48 30 0 0Z" transform="translate(200 300) rotate(-57)"/>
      <path d="M0 0C48 -45 159 -38 241 0C154 33 53 43 0 0Z" transform="translate(200 300) rotate(-123)"/>
      <path d="M0 0C33 -33 74 -12 102 -24S164 -4 204 12C164 13 135 5 106 16S41 28 0 0Z" transform="translate(200 300) rotate(-26)"/>
      <path d="M0 0C33 -31 74 -11 102 -23S164 -4 204 11C164 12 135 4 106 15S41 26 0 0Z" transform="translate(200 300) rotate(-154)"/>
      <path d="M0 0C29 -29 96 -25 146 0C93 22 32 28 0 0Z" transform="translate(200 300) rotate(4)"/>
      <path d="M0 0C28 -27 92 -22 140 0C90 20 31 25 0 0Z" transform="translate(200 300) rotate(-184)"/>
    </clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".55">
    <circle cx="40" cy="60" r="50" fill="#e1f1bf"/>
    <circle cx="370" cy="50" r="40" fill="#cfe6a6"/>
    <circle cx="40" cy="370" r="56" fill="#3b6628"/>
    <circle cx="360" cy="380" r="50" fill="#6b5034"/>
  </g>

  <path d="M200 304C208 340 216 372 230 420" fill="none" stroke="#1d1a10" stroke-opacity=".3" stroke-width="18" stroke-linecap="round" filter="url(#shadow)" transform="translate(6 8)"/>
  <path d="M200 304C208 340 216 372 230 420" fill="none" stroke="url(#stalk)" stroke-width="13" stroke-linecap="round"/>

  <g filter="url(#shadow)" opacity=".32" fill="#1d1a10" transform="translate(7 11)">
    <path d="M0 0C52 -48 172 -40 260 0C167 35 57 45 0 0Z" transform="translate(200 300) rotate(-90)"/>
    <path d="M0 0C38 -36 86 -13 119 -26S190 -4 238 13C190 13 157 5 124 18S48 30 0 0Z" transform="translate(200 300) rotate(-57)"/>
    <path d="M0 0C48 -45 159 -38 241 0C154 33 53 43 0 0Z" transform="translate(200 300) rotate(-123)"/>
    <path d="M0 0C33 -33 74 -12 102 -24S164 -4 204 12C164 13 135 5 106 16S41 28 0 0Z" transform="translate(200 300) rotate(-26)"/>
    <path d="M0 0C33 -31 74 -11 102 -23S164 -4 204 11C164 12 135 4 106 15S41 26 0 0Z" transform="translate(200 300) rotate(-154)"/>
    <path d="M0 0C29 -29 96 -25 146 0C93 22 32 28 0 0Z" transform="translate(200 300) rotate(4)"/>
    <path d="M0 0C28 -27 92 -22 140 0C90 20 31 25 0 0Z" transform="translate(200 300) rotate(-184)"/>
  </g>
  <path d="M0 0C52 -48 172 -40 260 0C167 35 57 45 0 0Z" transform="translate(200 300) rotate(-90)" fill="url(#leaf)"/>
  <path d="M0 0C38 -36 86 -13 119 -26S190 -4 238 13C190 13 157 5 124 18S48 30 0 0Z" transform="translate(200 300) rotate(-57)" fill="url(#leaf)"/>
  <path d="M0 0C48 -45 159 -38 241 0C154 33 53 43 0 0Z" transform="translate(200 300) rotate(-123)" fill="url(#leaf)"/>
  <path d="M0 0C33 -33 74 -12 102 -24S164 -4 204 12C164 13 135 5 106 16S41 28 0 0Z" transform="translate(200 300) rotate(-26)" fill="url(#leaf)"/>
  <path d="M0 0C33 -31 74 -11 102 -23S164 -4 204 11C164 12 135 4 106 15S41 26 0 0Z" transform="translate(200 300) rotate(-154)" fill="url(#leaf)"/>
  <path d="M0 0C29 -29 96 -25 146 0C93 22 32 28 0 0Z" transform="translate(200 300) rotate(4)" fill="url(#leaf)"/>
  <path d="M0 0C28 -27 92 -22 140 0C90 20 31 25 0 0Z" transform="translate(200 300) rotate(-184)" fill="url(#leaf)"/>
  <g clip-path="url(#leaflets)">
    <rect width="400" height="400" filter="url(#pale)"/>
    <rect width="400" height="400" filter="url(#yellow)"/>
  </g>
  <g fill="none" stroke-linecap="round" clip-path="url(#leaflets)">
    <g transform="translate(200 300) rotate(-90)"><path d="M43 0l-15 -25M43 0l-15 25M87 0l-15 -25M87 0l-15 25M130 0l-15 -25M130 0l-15 25M174 0l-15 -25M174 0l-15 25M217 0l-15 -25M217 0l-15 25" stroke="#e3ecb8" stroke-width="1.1" opacity=".45"/><path d="M3 0Q130 -2 254 0" stroke="#f0f5cf" stroke-width="3" opacity=".9"/></g>
  <g transform="translate(200 300) rotate(-57)"><path d="M40 0l-13 -21M40 0l-13 21M79 0l-13 -21M79 0l-13 21M119 0l-13 -21M119 0l-13 21M159 0l-13 -21M159 0l-13 21M198 0l-13 -21M198 0l-13 21" stroke="#e3ecb8" stroke-width="1.1" opacity=".45"/><path d="M3 0Q119 -6 232 9" stroke="#f0f5cf" stroke-width="3" opacity=".9"/></g>
  <g transform="translate(200 300) rotate(-123)"><path d="M40 0l-14 -24M40 0l-14 24M80 0l-14 -24M80 0l-14 24M120 0l-14 -24M120 0l-14 24M161 0l-14 -24M161 0l-14 24M201 0l-14 -24M201 0l-14 24" stroke="#e3ecb8" stroke-width="1.1" opacity=".45"/><path d="M3 0Q120 -2 235 0" stroke="#f0f5cf" stroke-width="3" opacity=".9"/></g>
  <g transform="translate(200 300) rotate(-26)"><path d="M34 0l-12 -20M34 0l-12 20M68 0l-12 -20M68 0l-12 20M102 0l-12 -20M102 0l-12 20M136 0l-12 -20M136 0l-12 20M170 0l-12 -20M170 0l-12 20" stroke="#e3ecb8" stroke-width="1.1" opacity=".45"/><path d="M3 0Q102 -6 198 9" stroke="#f0f5cf" stroke-width="3" opacity=".9"/></g>
  <g transform="translate(200 300) rotate(-154)"><path d="M34 0l-11 -18M34 0l-11 18M68 0l-11 -18M68 0l-11 18M102 0l-11 -18M102 0l-11 18M136 0l-11 -18M136 0l-11 18M170 0l-11 -18M170 0l-11 18" stroke="#e3ecb8" stroke-width="1.1" opacity=".45"/><path d="M3 0Q102 -5 198 8" stroke="#f0f5cf" stroke-width="3" opacity=".9"/></g>
  <g transform="translate(200 300) rotate(4)"><path d="M24 0l-9 -15M24 0l-9 15M49 0l-9 -15M49 0l-9 15M73 0l-9 -15M73 0l-9 15M97 0l-9 -15M97 0l-9 15M121 0l-9 -15M121 0l-9 15" stroke="#e3ecb8" stroke-width="1.1" opacity=".45"/><path d="M3 0Q73 -1 140 0" stroke="#f0f5cf" stroke-width="3" opacity=".9"/></g>
  <g transform="translate(200 300) rotate(-184)"><path d="M23 0l-8 -14M23 0l-8 14M47 0l-8 -14M47 0l-8 14M70 0l-8 -14M70 0l-8 14M93 0l-8 -14M93 0l-8 14M117 0l-8 -14M117 0l-8 14" stroke="#e3ecb8" stroke-width="1.1" opacity=".45"/><path d="M3 0Q70 -1 134 0" stroke="#f0f5cf" stroke-width="3" opacity=".9"/></g>
  </g>
  <circle cx="200" cy="300" r="8" fill="#a83d35"/>
</svg>
