# Produce Market: farmers list what they have to sell.
# The app has no buyer side, offers or chat yet, so the copy makes no
# promises about buyers, sales or prices.

slug: produce-market
order: 4
name: Produce Market
appTagline: Sell crops & livestock
accent: accent
icon: store

card:
  summary: Post your harvest and animals for sale at your own asking price.
  points:
    - Free to list
    - Crops, livestock, honey, flour and more
    - Mark items as sold when they go
  image:
    src: /images/products/produce-market.webp
    alt: A farmer at a market stall of fresh produce
    width: 480
    height: 480

hero:
  eyebrow: Produce Market · Sell crops & livestock
  headline: Post your produce on the EzyAgric market
  intro: "Farmer or agribusiness, list your ==crops, animals and farm products== in ==[a few taps](/produce-market/#how-it-works)==. You choose the quantity, the unit and ==your asking price==."
  image:
    src: /images/products/produce-market.webp
    alt: A farmer at a market stall of fresh produce
    width: 480
    height: 480

cta:
  label: List your produce
  campaign: produce-market

availability: Free to list.

features:
  title: What you can do
  items:
    - title: List almost anything you produce
      text: "Crops, livestock and other produce such as honey, manure, maize and cassava flour, hides and skins."
      icon: sprout
    - title: Your units, your price
      text: "Sell by kg, 50 or 100 kg bag, 20 litre tin, sack, bunch, piece or dozen, at your own asking price."
      icon: tag
    - title: Show where it is
      text: Add your region, district and village.
      icon: map-pin
    - title: Save a draft first
      text: Start a listing now and publish it when you're ready.
      icon: clipboard-list
    - title: Mark it as sold
      text: Edit or remove a listing any time, and mark it sold when it's gone.
      icon: check-circle
    - title: Free to list
      text: Posting your produce costs nothing.
      icon: badge-percent

steps:
  title: How to list your produce
  items:
    - title: Post a new item
      text: Open Produce Market in the app and tap Post New Item.
      action: { kind: get-app, label: Get the EzyAgric App }
    - title: Add the details
      text: Choose the produce and variety, then add quantity, unit, price and location.
    - title: Publish
      text: Your produce is now live on the market.
      # The next question once it's live: how buyers get in touch (the FAQ below).
      action: { kind: page, label: How buyers reach you, href: "/produce-market/#faq" }
    - title: Mark it as sold
      text: Update the listing when it's sold.

# A photo from one of EzyAgric's project partnerships (no names: the alt
# text describes, it never identifies).
photo:
  image:
    src: /images/photos/farmer-maize-harvest.webp
    alt: A smiling farmer holds up a maize cob she has just harvested from her garden
    width: 1000
    height: 714
    # Right of centre: from lg the photo is cropped tall beside the steps and
    # fades into navy on its right, and this keeps her face clear of the fade
    # with the maize cob in view.
    focus: "85% 40%"

faq:
  - q: Does it cost anything to list?
    a: No. Listing your produce is free.
    actions:
      - { kind: get-app }
  - q: Who sets the price?
    a: You do. Set your own asking price per unit.
    actions:
      - { kind: get-app }
  - q: How do buyers contact me?
    a: "Buyers who see and are interested in your listing get in touch with you directly."
    actions:
      - { kind: get-app }
  - q: Where can I sell?
    a: Produce Market is available in Uganda for now.
    actions:
      - { kind: whatsapp, label: "Ask us on WhatsApp" }

seo:
  title: "Produce Market: list your crops and livestock for sale | EzyAgric"
  description: "Farmers and agribusinesses: post crops, livestock and farm products for sale in the EzyAgric App. Set your own units and asking price. Free to list, in Uganda."
