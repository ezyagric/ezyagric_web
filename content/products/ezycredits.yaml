faq:
  - q: What is the difference between the Wallet and Pay Later?
    a: "The Wallet holds money you've already topped up. Pay Later lets you get your order now and repay after it's delivered."
  - q: How do I top up my Wallet?
    a: With MTN or Airtel Mobile Money, from your profile in the app.
  - q: Who can use Pay Later?
    a: "Farmers in Uganda who complete their profile can apply. Pezesha decides who gets credit, so not everyone is approved. Limits and terms are different for each farmer."
  - q: How much can I borrow?
    a: "Your offer in the app shows your limit. It can grow as you keep buying and repaying."
  - q: Can I have two Pay Later loans at once?
    a: No. Repay your current Pay Later loan before you use Pay Later again.
  - q: In the app I see "BNPL". Is that Pay Later?
    a: Yes. BNPL (buy now, pay later) in the app is EzyCredits Pay Later.

