  summary: Your personal expert for crops and livestock. Work with it by text or voice, in English, Luganda or other local languages, any time of day.
  points:
    - Spot crop and livestock diseases early from a photo
    - Map your garden and keep your farm records
    - Free to start, then from UGX 5,000 a month
