# Feature names and lines from the Ka-Ezy flier and the weekly campaign banners.
features:
  title: Everything in one app
  items:
    - title: Expert farm advice
      text: "Trusted guidance for every crop and livestock decision, personalised to your exact location. Share what you see by text or voice, in English, Luganda or other local languages."
      icon: message-circle
    # Includes "Order what it recommends" (merged to keep six boxes, 27 Oct 2026).
    - title: Instant disease diagnosis
      text: "Sick plant or animal? Snap a photo and Ka-Ezy shows you what it may be, so you can act early. You're advised to confirm with an expert before you buy an expensive treatment. Order what you need straight from [Agrishop](/agrishop/)."
      icon: camera
    - title: Garden mapping
      text: "Walk your garden once and Ka-Ezy maps it: its estimated acreage, its outline and the spots that need your inputs most."
      icon: map
    - title: Farm records
      text: "Keep your income and expenses in one place. Track activities, monitor progress and grow profitably."
      icon: line-chart
    - title: A farm plan for your budget
      text: "Answer a few questions and Ka-Ezy builds a costed plan for your land and goals, with investment, revenue and profit."
      icon: clipboard-list
    - title: Soil and weather insights
      text: Advice that takes your soil and the weather into account, for more than 40 crops and animals.
      icon: globe

