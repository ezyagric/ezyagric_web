    ownPhotoReply: "[[{name}, ]]thanks for the photo. On the website I can only check the sample photos, so I can't tell you what's in yours. In the EzyAgric App, snap the sick leaf, fruit or animal and I'll tell you what's wrong and how to treat it."
    pest: Pest detected
    disease: Disease detected
    signs: What I see
    steps: What to do
    sampleNote: A sample diagnosis for this demo. In the EzyAgric App, Ka-Ezy checks your own photos.
    nudge: Hire Ka-Ezy to check your own crops and animals
    samples:
      - crop: Maize
        kind: pest
        name: Fall armyworm
        photo:
          src: /images/diagnosis/maize-fall-armyworm.svg
          alt: "Sample photo: a maize leaf with ragged holes, droppings and a caterpillar"
          width: 400
          height: 400
        question: What is eating my maize leaves?
        intro: "[[{name}, ]]this looks like fall armyworm. Its caterpillars feed in the funnel of young maize and can strip a garden fast, so act this week."
        signs:
          - Ragged holes and see-through patches on the young leaves
          - Droppings like sawdust on the leaf, near the caterpillar
          - A caterpillar with a pale upside-down Y on its head
        steps:
          - At least once a week, check 20 plants across the garden, looking into the funnel.
          - On a small garden, crush the egg masses and caterpillars you find.
          - If many plants are hit, spray a pesticide approved for fall armyworm into the funnel, early in the morning or late in the evening, following the label.
          - Next season, plant early, at the start of the rains, and keep the garden weeded.
      - crop: Cassava
        kind: disease
        name: Cassava mosaic disease
        photo:
          src: /images/diagnosis/cassava-mosaic.svg
          alt: "Sample photo: a cassava leaf with yellow and green patches and twisted leaflets"
          width: 400
          height: 400
        question: Why are my cassava leaves yellow and twisted?
        intro: "[[{name}, ]]this looks like cassava mosaic disease. Whiteflies and cuttings from sick plants spread it, and no spray cures it."
        signs:
          - Yellow and pale-green patches across the leaves
          - Leaflets twisted, narrow and smaller than normal
        steps:
          - Uproot sick plants early and destroy them, so the disease doesn't spread.
          - Never take cuttings from sick plants.
          - Plant clean cuttings of a mosaic-resistant variety from a trusted supplier.
          - Check under the leaves for whiteflies, and keep the garden weeded.
      - crop: Coffee
        kind: disease
        name: Coffee leaf rust
        photo:
          src: /images/diagnosis/coffee-leaf-rust.svg
          alt: "Sample photo: a coffee leaf with orange powdery spots"
          width: 400
          height: 400
        question: What are these orange spots on my coffee leaves?
        intro: "[[{name}, ]]this looks like coffee leaf rust, a fungus. It makes the leaves fall early, which weakens the trees and cuts next season's harvest."
        signs:
          - Orange, powdery spots on the leaves
          - Pale yellow patches around the spots
          - Spots joining up into larger patches
        steps:
          - Prune and remove extra suckers, so light and air get into the trees.
          - Rake up fallen leaves and destroy them.
          - Spray a copper fungicide approved for coffee at the start of the rains, following the label.
          - Feed the trees well, and plant a rust-resistant variety when you replant.
