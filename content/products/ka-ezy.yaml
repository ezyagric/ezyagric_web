features:
  title: What Ka-Ezy can do for you
  items:
    - title: Ask by text or voice
      text: Type your question or tap the mic to speak. Ka-Ezy answers in English or Luganda, day or night.
      icon: mic
    - title: Diagnose crop and animal problems
      text: Snap a photo of a sick crop or describe your animal's symptoms, and get advice on what to do.
      icon: camera
    - title: Get a farm plan
      text: "Answer a few questions and Ka-Ezy builds a plan for your land, budget and goals — with estimated investment, revenue and profit."
      icon: clipboard-list
    - title: Keep your records
      text: Record your farm income and expenses as you go.
      icon: line-chart
    - title: Advice for 40+ crops and animals
      text: Pick the crops and animals you keep. Ka-Ezy gives soil, fertilizer and seasonal advice for more than 40 of them.
      icon: sprout
    - title: Satellite, soil and weather insights
      text: Advice that takes your land, soil and the weather into account.
      icon: globe
      pending: true
      note: In the Business Profile 2026, but the app review found no weather screen — confirm before launch.
    - title: Garden mapping
      text: Map your gardens for free. See their size and details with Ka-Ezy.
      icon: map
    - title: Guides and videos
      text: Read crop and animal guides and watch recommended videos.
      icon: book-open
    - title: Order what it recommends
      text: When your farm plan or a diagnosis recommends an input, order it straight from Agrishop.
      icon: shopping-cart

steps:
  title: How to start
  items:
    - title: Open Ka-Ezy
      text: Get the EzyAgric app and tap Ka-Ezy on the home screen.
    - title: Start free
      text: Every farmer gets free Ka-Ezy tokens (credits for questions and advice). No payment needed.
    - title: Renew when you need more
      text: When your free tokens run out, renew for UGX 5,000 with MTN or Airtel Mobile Money.

