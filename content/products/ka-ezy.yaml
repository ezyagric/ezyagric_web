# Feature names and lines from the Ka-Ezy flier and the weekly campaign banners.
features:
  title: Everything in one app
  items:
    - title: Expert farm advice
      text: "Trusted answers for every farming decision, personalised to your exact location. Ask by text or voice, in English or Luganda."
      icon: message-circle
    - title: Instant disease diagnosis
      text: "Sick plant? Snap a photo and Ka-Ezy tells you what's wrong — spot crop diseases early and act before it is too late. You can also check livestock symptoms."
      icon: camera
    - title: Garden mapping
      text: "Walk your garden once and Ka-Ezy maps it — exact acreage, clear boundaries and the spots that need your inputs most."
      icon: map
    - title: Farm records
      text: "Keep your income and expenses in one place. Track activities, monitor progress and grow profitably."
      icon: line-chart
    - title: A farm plan for your budget
      text: "Answer a few questions and Ka-Ezy builds a plan for your land, budget and goals — with estimated investment, revenue and profit."
      icon: clipboard-list
    - title: Soil and weather insights
      text: Advice that takes your soil and the weather into account, for more than 40 crops and animals.
      icon: globe
    - title: Order what it recommends
      text: When your farm plan or a diagnosis recommends an input, order it straight from Agrishop.
      icon: shopping-cart

