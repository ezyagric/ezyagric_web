tryIt:
  pending: true
  note: "Agronomy team to check the sample answers (crops, animals, and fish, bees and mushrooms), the sample photo diagnoses and the sample plan figures (costs, yields and prices). Paying on the website is a demo until engineering adds secure web sign-in and a payment API; until then the live site sends visitors to the app to pay."
  eyebrow: Try Ka-Ezy
  title: Ask Ka-Ezy, then hire it
  intro: "Tell Ka-Ezy about your farm, then ask it anything, check a sick crop or animal from a photo, map a garden, plan your season and keep records. When you're ready, choose a plan and pay with Mobile Money."
  # Ka-Ezy's answers and plan figures below are samples written for the
  # website. They are personalised from "Your farm": {name}, {crop}, {location}
  # and {acres} are filled in, and a part in [[ ]] is left out when one of its
  # details is not given.
  farm:
    title: Your farm
    valueChain: Value chain
    valueChainPlaceholder: Choose a crop or animal
    optionalTitle: Farm details (optional)
    location: Location
    locationHint: For local weather and timing advice.
    landSize: Land size (acres)
    firstName: Your first name
    firstNameHint: Used to personalise answers.
    storage: Saved on this device only, to tailor Ka-Ezy's answers.
    storageLive: Saved on this device only, and sent with your questions so Ka-Ezy can tailor its answers.
    pastTitle: Past conversations
    pastEmpty: No conversations yet.
    newConversation: New conversation
    clear: Delete all
  # The app's value chains (FarmPlanOptions.valueChainItems), grouped.
  valueChains:
