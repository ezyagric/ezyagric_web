      items: [Maize, Beans, Cassava, Banana/Matooke, Rice, Groundnuts, Soybean, Sorghum, Millet, Sunflower, Cotton, Irish Potato, Sweet Potato, Tomato, Onion, Cabbage, Red Pepper, Green Pepper, Sukuma Wiki, Spinach, Amaranth, Cucumber, Watermelon, Eggplant, Okra, Carrots, Garlic, Ginger, Citrus, Sesame, Yams, Pumpkin]
