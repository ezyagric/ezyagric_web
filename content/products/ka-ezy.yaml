    intro: Tell Ka-Ezy what happened on your farm, the way you'd say it. It turns it into a record and keeps your totals.
    placeholder: e.g. Sold 5 bags of maize for 600,000
    examples:
      - Sold 5 bags of maize for 600,000
      - Bought 2 bags of DAP for 340,000
      - Paid 3 workers 45,000 for weeding
      - Vaccinated the chickens
    prompt: Save this to your farm records?
    notUnderstood: "I couldn't tell what happened from that. Try something like \"Sold 5 bags of maize for 600,000\" or \"Bought feed for 50,000\"."
    saved: Saved to your farm records.
    dismissed: Not saved.
    totals: { income: Income, expenses: Expenses, profit: Profit }
    nudge: In the EzyAgric App, Ka-Ezy keeps all your records and uses them to advise you.
  # Garden Mapping: Ka-Ezy's guide, and a tap-the-corners map to try.
  mapping:
    intro: In the EzyAgric App you walk around your garden with your phone and Ka-Ezy maps it by GPS. Here, tap the corners of the field to see how it works.
    steps:
      - Open Garden Mapping in the EzyAgric App and give your garden a name.
      - Stand at one corner and wait until the app shows good GPS accuracy.
      - Start mapping, then walk along the edge of the garden with your phone in your hand.
      - Walk all the way round, back to where you started.
      - Finish the map. Ka-Ezy shows the size in acres and saves the garden with your farm.
    tryTitle: "Try it: tap the corners of the garden"
    sample: Use a sample garden
    undo: Undo last corner
    clear: Clear
    finish: Finish the map
    result: "[[{name}, ]]your garden is **{mapped}** ({m2} square metres), with a boundary of **{perimeter} m**."
    useSize: "Use {mapped} in Your farm"
    planIt: Make a farm plan for it
    nudge: Map your real garden with GPS in the EzyAgric App.
  hire:
    title: Hire Ka-Ezy
    intro: Choose a plan, then pay with MTN MoMo or Airtel Money.
    # "Why farmers choose Ka-Ezy" in the app's plan screen.
    benefits:
      - Get instant guidance for your crops and livestock.
      - Use photo diagnosis to spot farm problems early.
      - Map your gardens and get soil, fertilizer and season plans.
    accountHelp: Use the number you sign in to the EzyAgric App with. Your plan is added to that account.
    policy: EzyAgric never asks for or stores your Mobile Money PIN.
    appHandoff: "Paying on the website is coming soon. For now, hire Ka-Ezy in the EzyAgric App: open Ka-Ezy and tap View Ka-Ezy Plans."

