    errors:
      offline: Unable to connect. Check your internet and try again.
      busy: Server is busy right now. Please try again shortly.
      limit: "That's all the questions for this demo. Hire Ka-Ezy to keep asking about your own farm, any time."
    nudge: "Ready to ask about your own farm? Hire Ka-Ezy for advice made for your crops and livestock, day or night."
    disclaimer: "Ka-Ezy's advice may vary. For serious crop or animal health problems, talk to an agronomist or a vet."
