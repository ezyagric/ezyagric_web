# "Ask Ka-Ezy, then hire it", right below the videos. The answers are sample
# answers written for the website (there is no safe way yet for a public web
# page to reach the real Ka-Ezy or take payment: see README, "Ka-Ezy on the
# website"). Preview builds simulate paying with Mobile Money; the live site
# sends visitors to the app to pay.
tryIt:
  pending: true
  note: "Agronomy team to check the four sample answers. Paying on the website is a demo until engineering adds secure web sign-in and a payment API; until then the live site sends visitors to the app to pay."
  eyebrow: Try it now
  title: Ask Ka-Ezy, then hire it
  intro: "Tap a question to see how Ka-Ezy answers. When you're ready, choose a plan and pay with Mobile Money."
  chat:
    greeting: Hello farmer
    subtitle: "Ask anything about your farm: crops, pests, planning or records."
    tryAsking: Try asking
    placeholder: Ask Ka-Ezy...
    prompts:
      - q: What should I plant this season?
        a: |
          The best crop depends on your district, your land and when the rains start. Here is how I would choose with you:

          - **Quick income (about 3 months):** beans, or vegetables such as tomatoes, cabbages and onions if you are near a market.
          - **Food and a steady market:** maize stores well and has ready buyers.
          - **Long-term income:** coffee or bananas, if you can wait for the first harvest.

          Plant at the start of the rains, so your crop has water when it needs it most. Tell me your district and how much land you have, and I'll suggest the best fit, with a budget.
      - q: How do I prepare my soil?
        a: |
          Good preparation gives your seeds a strong start:

          1. **Clear the land** of weeds, stumps and old crop remains.
          2. **Dig or plough deep,** so roots grow down easily, then break up big clods.
          3. **Add organic matter,** such as well-rotted manure or compost, a few weeks before planting.
          4. **Test your soil.** A soil test shows which fertilizer your land needs, so you don't waste money.
          5. **Make ridges or raised beds** where water collects, so roots don't rot.

          In the EzyAgric App I can turn this into a step-by-step plan for your garden and crop.
      - q: Recommend a farm record to keep
        a: |
          Start with an **income and expenses record**. It shows you whether your farm makes a profit.

          For every entry, write down:

          - the date
          - what it was for (seed, fertilizer, labour, transport or a sale)
          - the amount in UGX

          At the end of the season, add up your income and take away your expenses: that is your profit. In the EzyAgric App you keep these records on your phone, and I use them to give you better advice.
      - q: Tips to boost my yields
        a: |
          Five things that make the biggest difference:

          1. **Use certified seed** from a trusted supplier. You can order genuine seed on Agrishop.
          2. **Plant on time,** at the start of the rains, with the right spacing.
          3. **Feed your soil** with manure, compost or the right fertilizer for your crop.
          4. **Weed early.** Weeds steal water and food from young plants.
          5. **Check for pests and diseases every week** and act early. Snap a photo in the app and I'll tell you what's wrong.

          Tell me your crop and I'll give you a plan made for it.
    ownQuestionReply: "On the website I can only answer the sample questions. Ask me about your own farm in the EzyAgric App, where your first questions are free."
    # When the chat uses live Ka-Ezy answers (NEXT_PUBLIC_KAEZY_DEMO_API) and
    # a question fails. The first two are the app's own messages.
    errors:
      offline: Unable to connect. Check your internet and try again.
      busy: Server is busy right now. Please try again shortly.
      limit: "That's all the questions for this demo. Hire Ka-Ezy to keep asking about your own farm, any time."
    nudge: "Ready to ask about your own farm? Hire Ka-Ezy for advice made for your gardens, day or night."
    disclaimer: "Ka-Ezy's advice may vary. For serious crop or animal health problems, talk to an agronomist or a vet."
