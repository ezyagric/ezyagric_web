disclaimer: "Ka-Ezy is an AI assistant and its advice can sometimes be wrong. For serious crop or animal health problems, talk to an agronomist or a vet."

faq:
  - q: Is Ka-Ezy free?
    a: "You can try Ka-Ezy for free with limited use. After that, choose a paid plan."
  - q: How do I pay for a plan?
    a: With MTN or Airtel Mobile Money, inside the app.
  - q: Can I talk to Ka-Ezy instead of typing?
    a: Yes. Tap the microphone and speak your question.
  - q: Does Ka-Ezy help with livestock too?
    a: "Yes. Choose the crops and animals you keep, and Ka-Ezy gives advice for them — including checking livestock symptoms."
  - q: Is Ka-Ezy always right?
    a: "Ka-Ezy is an AI assistant and can make mistakes. For serious problems, talk to an agronomist or a vet."

