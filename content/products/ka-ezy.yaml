  # Shown in this order (TABS in components/product/kaezy/store.ts).
  tabs:
    expert: { title: Farm Expert, text: "Ask Ka-Ezy about a crop or animal, or check a photo of a sick one." }
    mapping: { title: Garden Mapping, text: The guide to mapping a garden by GPS. }
    plan: { title: Farm Plan, text: "A costed plan from setup to harvest, scaled to your farm." }
    records: { title: Farm Records, text: "Income, expenses and activities, with totals." }
  chat:
    greeting: Hello there
    greetingNamed: "Hello, {name}"
    subtitle: "Ask anything about your farm: crops, livestock, pests, planning or records."
    personalised: "Answers for {crop}[[ in {location}]][[, {acres}]]"
    choosePrompt: Choose your value chain in Your farm for answers about your farm.
    tryAsking: Try asking
    placeholder: Ask Ka-Ezy...
    # Before a value chain is chosen.
    prompts:
      - q: What should I plant this season?
        a: |
          [[{name}, ]]the best crop depends on your district, your land and when the rains start[[ in {location}]]. Here is how I would choose with you:

          - **Quick income (about 3 months):** beans, or vegetables such as tomatoes, cabbages and onions if you are near a market.
          - **Food and a steady market:** maize stores well and has ready buyers.
          - **Long-term income:** coffee or bananas, if you can wait for the first harvest.

          Plant at the start of the rains, so your crop has water when it needs it most. Choose your value chain in Your farm and I'll give you answers for it[[, with a budget for your {acres}]].
      - q: How do I prepare my soil?
        a: |
          Good preparation gives your seeds a strong start:

          1. **Clear the land** of weeds, stumps and old crop remains.
          2. **Dig or plough deep,** so roots grow down easily, then break up big clods.
          3. **Add organic matter,** such as well-rotted manure or compost, a few weeks before planting.
          4. **Test your soil.** A soil test shows which fertilizer your land needs, so you don't waste money.
          5. **Make ridges or raised beds** where water collects, so roots don't rot.

          In the EzyAgric App I can turn this into a step-by-step plan for your garden and crop.
      - q: Recommend a farm record to keep
        a: |
          Start with an **income and expenses record**. It shows you whether your farm makes a profit.

          For every entry, write down:

          - the date
          - what it was for (seed, fertilizer, feed, labour, transport or a sale)
          - the amount in UGX

          At the end of the season, add up your income and take away your expenses: that is your profit. Try it in the Farm Records tab: tell me what happened and I'll keep the totals.
      - q: How do I keep my animals healthy?
        a: |
          Prevention costs far less than treatment. Five things that help most:

          1. **Buy good stock and quality feed** from trusted suppliers. You can order feeds on Agrishop.
          2. **Give clean water all the time,** and keep housing clean, dry and well aired.
          3. **Vaccinate on schedule,** and deworm as your vet advises.
          4. **Keep new animals apart** for two weeks before mixing them in.
          5. **Check your animals every day** and act early. Snap a photo in the app and I'll tell you what's wrong.

          Choose your animal in Your farm and I'll give you advice made for it.
    # When a crop is chosen (the app's own crop questions).
    cropPrompts:
      - q: "Best fertilizer schedule for {crop}"
        a: |
          [[{name}, ]]a good fertilizer plan for {crop} starts with your soil[[ in {location}]]:

          1. **Test your soil first.** It shows which nutrients your land lacks, so you only buy what it needs.
          2. **At planting:** mix well-rotted manure or compost into the soil, with a planting fertilizer recommended for {crop}.
          3. **While it grows:** top-dress when the crop is growing fast, on moist soil, a little away from the stems.
          4. **Follow the label** for amounts, and never apply on dry soil.

          [[For your {acres}, ]]Ka-Ezy in the app works out the exact products, amounts and cost, and you can order them on Agrishop.
      - q: "Common pests in {crop} and how to control them"
        a: |
          Pests do most damage when they are caught late. For {crop}[[ in {location}]]:

          - **Scout every week:** look under leaves and along stems for insects, holes, spots or wilting.
          - **Act early:** remove and destroy badly affected plants so problems don't spread.
          - **Keep the garden clean:** weed often and clear old crop remains, where pests hide.
          - **Rotate crops** each season where you can, to break pest cycles.
          - **Use the right product:** if you need a pesticide, use one approved for {crop}, follow the label and wear protective gear.

          Snap a photo in the EzyAgric App and Ka-Ezy tells you which pest or disease it is and how to treat it.
      - q: "When should I harvest {crop}?"
        a: |
          [[{name}, ]]harvest time for {crop} depends on the variety and when you planted it. Signs it is ready:

          - it has reached the maturity period for its variety (check the seed packet or ask your supplier)
          - leaves start to dry or change colour, and grains, pods or fruits are firm and well filled
          - for grains and pulses, harvest in dry weather, then dry the crop well before storing

          Harvesting too early lowers your yield; too late invites pests and losses in the field. Tell Ka-Ezy your variety and planting date in the app and it gives you your harvest window.
      - q: "How to increase {crop} yield"
        a: |
          Five things that make the biggest difference for {crop}[[ on your {acres}]]:

          1. **Use certified seed** of a variety suited to your area[[ ({location})]]. You can order genuine seed on Agrishop.
          2. **Plant on time,** at the start of the rains, with the right spacing for {crop}.
          3. **Feed your soil** with manure, compost or the right fertilizer for {crop}.
          4. **Weed early.** Weeds steal water and food from young plants.
          5. **Check for pests and diseases every week** and act early.

          In the EzyAgric App, Ka-Ezy builds a costed plan for your {crop}. On this page, the Farm Plan tab shows one for maize or beans.
    # When an animal, bird or fish is chosen.
    livestockPrompts:
      - q: "Best feeding plan for {crop}"
        a: |
          [[{name}, ]]good feeding is the biggest cost, and the biggest win, in {crop} farming:

          - **Feed for the stage:** young, growing and producing animals need different feeds. Use a feed made for each stage.
          - **Clean water all the time.** Animals eat less and produce less without it.
          - **Feed at regular times,** and keep feeders clean and dry so feed doesn't go mouldy.
          - **Buy quality feed** from a trusted supplier. You can order feeds on Agrishop.
          - **Weigh and record** what you feed, to spot problems early.

          In the app, Ka-Ezy works out a feeding plan and its cost for your animals.
      - q: "Common diseases in {crop} and how to prevent them"
        a: |
          Prevention costs far less than treatment. For {crop}[[ in {location}]]:

          - **Biosecurity:** limit visitors, clean boots and equipment, and keep new animals apart for two weeks before mixing them in.
          - **Clean housing:** dry, well-aired houses with clean bedding.
          - **Vaccinate on schedule,** and deworm as your vet advises.
          - **Watch every day** for animals that eat less, look dull, or have diarrhoea or breathing problems, and separate them quickly.
          - **Call a vet** for sudden deaths or many sick animals.
      - q: "Vaccination schedule for {crop}"
        a: |
          [[{name}, ]]the right schedule for {crop} depends on their type, age and the diseases common around you[[ in {location}]], so follow your vet's or supplier's schedule. Rules that always apply:

          - keep a written record of every vaccination: date, vaccine and batch
          - store vaccines cold and use them before they expire
          - vaccinate only healthy animals, and give every dose in the course

          In the app, Ka-Ezy builds a reminder schedule for your animals.
      - q: "How to increase {crop} production"
        a: |
          To get more from your {crop}:

          1. **Start with good stock** from a trusted breeder or hatchery.
          2. **Feed well** for each stage, with clean water all the time.
          3. **Keep them healthy** with clean housing, vaccination and quick care for sick animals.
          4. **Keep records** of feed, sales and losses, so you see what pays.
          5. **Plan your market** before you produce.

          Try the Farm Records tab: tell me what you spent and sold and I'll keep the totals.
    # Fish, bees and mushrooms.
    otherPrompts:
      - q: "How do I start {crop} farming?"
        a: |
          [[{name}, ]]a good start in {crop} farming[[ in {location}]] comes down to a few things:

          1. **Learn first:** visit a working farm near you and talk to people already doing it.
          2. **Start small,** then grow as you learn what works and where you can sell.
          3. **Get good starting stock** from a trusted supplier: certified fingerlings, healthy bee colonies or clean mushroom spawn.
          4. **Plan your costs and your market** before you spend: who will buy, at what price, and how often.
          5. **Keep records** from day one, so you know if it pays.

          In the EzyAgric App, Ka-Ezy gives you a step-by-step plan and its costs for {crop}.
      - q: "How to increase {crop} production"
        a: |
          To get more from your {crop}:

          - **Use good starting stock** from a trusted supplier.
          - **Keep conditions right:** clean water and good feed for fish, flowers and water near hives for bees, and clean, damp, shaded growing rooms for mushrooms.
          - **Check every week** and act early on problems.
          - **Keep records** of what you put in and what you harvest, to see what works.

          In the EzyAgric App, Ka-Ezy gives advice for your own {crop}, any time.
      - q: "What records should I keep for {crop}?"
        a: |
          Keep a simple record of:

          - what you spend: stock, feed or materials, labour and transport
          - what you harvest and sell, with dates and prices
          - problems you see and what you did about them

          At the end of each cycle, add up your sales and take away your costs: that is your profit. Try the Farm Records tab: tell Ka-Ezy what happened and it keeps the totals.
      - q: "Where can I sell my {crop}?"
        a: |
          [[{name}, ]]look for buyers before you harvest[[ around {location}]]:

          - local markets, shops, hotels and restaurants
          - traders and processors who buy in bulk
          - farmer groups and cooperatives that sell together for better prices

          On Produce Market in the EzyAgric App you can list your {crop} for free, at your own price.
    ownQuestionReply: "[[{name}, ]]on the website I can only answer the sample questions. Ask me about your own farm in the EzyAgric App, where your first questions are free."
    # When the chat uses live Ka-Ezy answers (NEXT_PUBLIC_KAEZY_DEMO_API) and
