faq:
  - q: Are the products genuine?
    a: "Agrishop sells inputs from credible suppliers, marked Genuine in the app."
  - q: Do prices include delivery?
    a: No. Prices don't include transport costs.
  - q: Can I pay when my order arrives?
    a: Yes. Choose Pay on Delivery at checkout.
  - q: Can I buy now and pay later?
    a: Yes, with EzyCredits Pay Later once you qualify.
  - q: Where does Agrishop deliver?
    a: Agrishop is available in Uganda for now.

