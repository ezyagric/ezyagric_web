cta:
  label: Shop on Agrishop
  campaign: agrishop

# No availability chips under the intro (removed 27 Oct 2026): the FAQ
# says prices don't include transport.

features:
  title: Why shop on Agrishop
  items:
    - title: Genuine inputs
      text: Over 1,000 genuine products from more than 60 manufacturers and suppliers, in the pack sizes you need.
      icon: shield-check
    - title: Delivered near you
      text: Order from anywhere in Uganda. We deliver to the doorstep of your shop, farm or office.
      icon: truck
    - title: Track every order
      text: "Follow your order from sent, to confirmed, to on the way, to delivered."
      icon: package
    - title: Smart ledger
      text: Your orders are automatically posted to your expense ledgers.
      icon: clipboard-list
    - title: Pay your way
      text: "MTN or Airtel Mobile Money, EzyCredits Pay Later (if you qualify), or Pay on Delivery."
      icon: wallet

steps:
  title: How to order
  items:
    - title: Find what you need
      text: "Search or shop by category: seeds, fertilizers, pesticides, livestock and more."
    - title: Confirm your order
      text: Add items to your cart, check your delivery address and confirm.
    - title: Choose how to pay
      text: Mobile Money, EzyCredits Pay Later, or pay on delivery.
    - title: Track your order
      text: Watch your order move until it's delivered.

# A real photo from the EzyAgric photo library.
photo:
  image:
    src: /images/photos/ezyagric-bag-coffee.webp
    alt: An EzyAgric bag among ripe red coffee cherries on the farm
    width: 1400
    height: 933
    # Well right of centre: from lg the box is narrower than the photo and
    # fades into navy on the right, and this keeps the logo and as much of
    # the wordmark on the bag as fits in frame (below lg the photo runs
    # across the top of the panel and nearly all of it shows).
    focus: "85% 50%"

# YouTube videos (ids from content/site.yaml videos).
videoIds:
  - "-VhNuO4fzh0"

faq:
  - q: Are the products genuine?
    a: "Yes. Agrishop sells genuine products from more than 60 manufacturers and suppliers."
    actions:
      - { kind: get-app }
  - q: Do prices include delivery?
    a: No. Prices don't include transport costs.
  - q: Can I pay when my order arrives?
    a: Yes. Choose Pay on Delivery at checkout.
  - q: Can I buy now and pay later?
    a: Yes, with EzyCredits Pay Later if you qualify. Pay Later credit is provided by Pezesha.
    actions:
      - { kind: page, label: "About Pay Later", href: "/ezycredits/" }
  - q: Where does Agrishop deliver?
    a: Agrishop is available in Uganda for now.
    actions:
      - { kind: whatsapp, label: "Ask us on WhatsApp" }

seo:
  title: "Agrishop: genuine farm inputs and vet services, delivered | EzyAgric"
  description: "Genuine seeds, feeds, fertilizers and vet supplies for farmers and agribusinesses. Book vet services, track orders and pay by Mobile Money, EzyCredits or on delivery."
