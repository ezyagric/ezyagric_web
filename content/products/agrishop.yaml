faq:
  - q: Are the products genuine?
    a: "Yes. Agrishop sells genuine products from more than 60 manufacturers and suppliers."
    actions:
      - { kind: get-app }
  - q: Do prices include delivery?
    a: No. Prices don't include transport costs.
    actions:
      - { kind: whatsapp, label: "Ask about delivery costs" }
  - q: Can I pay when my order arrives?
    a: Yes. Choose Pay on Delivery at checkout.
    actions:
      - { kind: get-app }
  - q: Can I buy now and pay later?
    a: Yes, with EzyCredits Buy Now, Pay Later if you qualify.
    actions:
      - { kind: page, label: "About Buy Now, Pay Later", href: "/ezycredits/" }
  - q: Where does Agrishop deliver?
    a: Agrishop is available in Uganda for now.
    actions:
      - { kind: whatsapp, label: "Ask us on WhatsApp" }

seo:
  title: "Agrishop: genuine farm inputs and vet products, delivered | EzyAgric"
  description: "Genuine seeds, feeds, fertilizers and vet supplies for farmers and agribusinesses. Pay by Mobile Money, on delivery or with Buy Now, Pay Later if you qualify."
