# Real photos of Agrishop deliveries (from the marketing team, 27 Oct 2026),
# in a band after the feature tiles: a brick of six (see PhotoGallery).
# From sm every box is 2:1 or nearly square, so each photo is cropped round
# its focus: the bikes and the trucks low in the frame, the shop's sign and
# front, and the heads in the others.
gallery:
  eyebrow: Delivery
  title: Delivered to your shop, farm or office
  images:
    - src: /images/photos/agrishop-delivery-fleet.webp
      alt: Two EzyAgric delivery motorbikes with branded delivery boxes and a green EzyAgric delivery van, parked and ready to go
      width: 1400
      height: 934
      focus: "50% 70%"
    - src: /images/photos/agrishop-delivery-handover.webp
      alt: An EzyAgric delivery agent in a high-visibility vest writes up a delivery beside the truck while the customer checks his phone, with sacks of DAP fertilizer and boxes of herbicide and foliar fertilizer at their feet
      width: 768
      height: 1020
      focus: "50% 40%"
    - src: /images/photos/agrishop-merchant-shop.webp
      alt: "Kalamba Agro Input Suppliers, an agro-input shop with a \"Powered by EzyAgric\" sign, with sprayers, watering cans, boots and sacks of inputs out front"
      width: 768
      height: 1024
      focus: "50% 80%"
    - src: /images/photos/agrishop-delivery-unloading.webp
      alt: Two EzyAgric staff unload an order from a green EzyAgric delivery van, with a boxed knapsack sprayer waiting on the ground
      width: 567
      height: 1008
      focus: "50% 60%"
    - src: /images/photos/agrishop-delivery-team-truck.webp
      alt: "The EzyAgric delivery team, three in the back of the truck and two in front, smile with boxes reading \"Order Agro-Inputs & We Shall Deliver!\""
      width: 720
      height: 1280
      focus: "50% 11%"
    - src: /images/photos/agrishop-delivery-trucks.webp
      alt: "Two EzyAgric delivery trucks, one branded \"All Genuine Agro-inputs Delivered\", parked under a large tree"
      width: 1280
      height: 960
      focus: "50% 75%"

# No availability chips under the intro (removed 27 Oct 2026): the FAQ
# says prices don't include transport.

features:
  title: Why shop on Agrishop
  items:
    - title: Genuine inputs
      text: Over 1,000 genuine products from more than 60 manufacturers and suppliers, in the pack sizes you need.
      icon: shield-check
    - title: Delivered near you
      text: Order from anywhere in Uganda. We deliver to the doorstep of your shop, farm or office.
      icon: truck
    - title: Track every order
      text: "Follow your order from sent, to confirmed, to on the way, to delivered."
      icon: package
    - title: Smart ledger
      text: Your orders are automatically posted to your expense ledgers.
      icon: clipboard-list
    - title: Pay your way
      text: "MTN or Airtel Mobile Money, Pay on Delivery, or [EzyCredits Buy Now, Pay Later](/ezycredits/) (if you qualify)."
      icon: wallet

steps:
  title: How to order
  items:
    - title: Find what you need
      text: "Search or shop by category: seeds, fertilizers, pesticides, livestock and more."
      action: { kind: get-app, label: Get the EzyAgric App }
    - title: Confirm your order
      text: Add items to your cart, check your delivery address and confirm.
    - title: Choose how to pay
      text: Mobile Money, pay on delivery, or EzyCredits Buy Now, Pay Later.
      action: { kind: page, label: "How Buy Now, Pay Later works", href: "/ezycredits/#how-it-works" }
    - title: Track your order
      text: Watch your order move until it's delivered.
      action: { kind: whatsapp, label: Ask about an order }

