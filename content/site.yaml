# The home page's teaser of EzyAgric Business (its page: content/business.yaml):
# the record book's four chapter pages fanned out, each opening its chapter
# and showing its module's audience and screen thumb from business.yaml.
organisations:
  eyebrow: For agribusinesses · EzyAgric Business
  title: Our four services, built for agribusiness enterprises
  intro: "EzyAgric Business brings our four services to the enterprises that work with farmers: Agrishop to input suppliers, Produce Market to off-takers, EzyCredits to financial institutions and fintechs, and Ka-Ezy to the businesses that give it to their farmers. Development partners, governments and other organisations interested in agriculture can use it too. In a [web portal](/ezyagric-business/#connect-portal), or through [APIs](/ezyagric-business/#connect-api) into the systems they already run."
  # How it connects, as chips on the tear line under the chapter fan (from sm).
  channels:
    - { icon: monitor, text: Web portal }
    - { icon: plug, text: APIs }
  cta:
    label: Explore EzyAgric Business
    href: /ezyagric-business/

faq:
  title: Questions farmers and agribusinesses ask
  intro: Quick answers about the app, Ka-Ezy and paying.
  # The card beside the questions (on phones, under them).
  help:
    title: Still have a question?
    text: Let Ka-Ezy assist you with anything on your farm, day or night, or chat with our team on WhatsApp.
    whatsapp: Chat on WhatsApp
  items:
    - q: Is the EzyAgric App free?
      a: "Yes. The app is free to download on Android from Google Play (and soon on iPhone from the App Store), and listing your produce on Produce Market is free. Ka-Ezy is free to start. When your free tokens run out, plans start from UGX 5,000 a month."
      actions:
        - { kind: try-kaezy }
        - { kind: get-app }
    - q: Where does EzyAgric work?
      a: "EzyAgric works across Uganda. Shopping on Agrishop, buying now and paying later with EzyCredits, and selling on Produce Market are available only in Uganda for now."
      actions:
        - { kind: page, label: "Explore our services", href: "/#solutions" }
        - { kind: get-app }
    - q: Can I use Ka-Ezy outside Uganda?
      a: "Yes. Ka-Ezy works wherever you can use the EzyAgric App."
      actions:
        - { kind: try-kaezy }
        - { kind: get-app }
    - q: How do I pay?
      a: "With MTN or Airtel Mobile Money, Pay on Delivery, or EzyCredits Buy Now, Pay Later (if you qualify)."
      actions:
        - { kind: page, label: "How Pay Later works", href: "/ezycredits/#how-it-works" }
    - q: Is there an iPhone app?
      a: "Coming soon. The EzyAgric App for iPhone launches on the App Store shortly. Until then, you can get it on Android from Google Play."
      actions:
        - { kind: get-app }
    - q: Can I get help from a person?
      a: "Yes. Chat with our team on WhatsApp or call us. Our [contact details](/#contact-us) are below."
      actions:
        - { kind: whatsapp, label: "Chat on WhatsApp" }
        - { kind: call, label: "Call us" }

contact:
