# EzyProduce is named in the Business Profile 2026 as EzyAgric's produce
# marketplace and business management platform for agribusinesses.
organisations:
  eyebrow: For agribusinesses · EzyProduce
  title: Run your agribusiness and farmer network on EzyProduce
  intro: "EzyProduce is EzyAgric's produce marketplace and business management platform for cooperatives, off-takers and agribusinesses."
  points:
    - { text: Bulk produce and trace it back to each farmer, icon: package }
    - { text: Pay farmers instantly, icon: hand-coins }
    - { text: Connect with ready buyers and off-takers, icon: users }
    - { text: Profile your farmers and track their training, icon: clipboard-list }
    - { text: "Manage suppliers, sales, purchases and expenses", icon: receipt }
    - { text: "Accounting, quality and compliance, and business reports", icon: shield-check }
  cta:
    label: Partner login
    url: https://sso.ezyagric.com
  image:
    src: /images/photos/web-portal.webp
    alt: EzyAgric web platform dashboard on a laptop and tablet
    width: 1080
    height: 660

faq:
  title: Questions farmers ask
  intro: Quick answers about the app, Ka-Ezy and paying.
  # The card beside the questions (on phones, under them).
  help:
    title: Still have a question?
    text: Ask Ka-Ezy any farm question, day or night, or chat with our team on WhatsApp.
    kaezy: Ask Ka-Ezy
    whatsapp: Chat on WhatsApp
  items:
    - q: Is the EzyAgric App free?
      a: "Yes. The app is free to download on Android from Google Play (and soon on iPhone from the App Store), and listing your produce on Produce Market is free. Ka-Ezy is free to start. When your free tokens run out, plans start from UGX 5,000 a month."
    - q: Where does EzyAgric work?
      a: "EzyAgric works across Uganda. Shopping and vet services on Agrishop, EzyCredits Pay Later and selling on Produce Market are available only in Uganda for now."
    - q: Can I use Ka-Ezy outside Uganda?
      a: "Yes. Ka-Ezy works wherever you can use the EzyAgric App."
      pending: true
      note: Confirm which countries to name (the app lists Uganda, Kenya, Tanzania, Rwanda, DR Congo and South Sudan).
    - q: How do I pay?
      a: "With MTN or Airtel Mobile Money, your EzyCredits Wallet, EzyCredits Pay Later (if you qualify), or Pay on Delivery."
    - q: Is there an iPhone app?
      a: "Coming soon. The EzyAgric App for iPhone launches on the App Store shortly. Until then, you can get it on Android from Google Play."
    - q: Can I get help from a person?
      a: "Yes. Chat with our team on WhatsApp or call us. Our contact details are below."

contact:
  title: Talk to us
  intro: "Questions about an order, Pay Later or your account? We're on WhatsApp."
  # Confirmed by the EzyAgric team, 26 Oct 2026.
  whatsapp:
    number: "+256 787 991 262"
    message: "Hello EzyAgric, I have a question:"
  phones:
    - number: "+256 708 383 845"
  emails:
