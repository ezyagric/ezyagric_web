# Site-wide copy for ezyagric.com.
#
# How to edit: change the text between quotes, keep the indentation.
# Mark anything not yet confirmed with `pending: true` and a `note`.
# Preview/staging builds show it with a "To confirm" badge; production
# builds hide it. Validated by src/lib/content.ts at build time.

# Visual theme from src/theme/themes.css: "ezyagric" (default) or
# "ezyagric-guide" (the Brand Guide's original blue and 8px buttons).
theme: ezyagric

name: EzyAgric
legalName: Akorion Company Limited
slogan: Farm the Ezy way.

# The Ka-Ezy banner, repeated at key points across the site (home page, every
# service page including Ka-Ezy's, the 404 page; a one-line strip in the
# menus) so visitors can watch, try, pay for and download Ka-Ezy from
# wherever they are. The "try" and "pay"
# links go to the Ka-Ezy page's "Ask Ka-Ezy, then hire it" section when the
# site shows it, else to the Ka-Ezy page and its plans.
kaezyBanner:
  eyebrow: Meet Ka-Ezy
  title: Your 24/7 farm expert, ready when you are
  intro: Watch Ka-Ezy at work, try it right here, pay with Mobile Money, or get the app.
  # The banner plays the Ka-Ezy demo video in place (the portrait video in
  # content/products/ka-ezy.yaml); this is the label above it.
  watch:
    title: See Ka-Ezy in action
  try:
    title: Try Ka-Ezy
    text: Ask Ka-Ezy a farm question right here and see how it answers.
    appText: Start free in the EzyAgric App. No payment needed.
    link: Try it now
    appLink: Start free
  pay:
    title: Pay
    text: Hire Ka-Ezy for 1 month for UGX 5,000, or save with 3 or 6 months. Pay with MTN MoMo or Airtel Money.
    link: See plans
  app:
    title: Download the App
    text: Ka-Ezy lives in the EzyAgric App, free to download.
  strip:
    label: Ka-Ezy, your 24/7 farm expert
    watch: See Ka-Ezy in action
    try: Try Ka-Ezy
    pay: Pay
    app: Download the App

# The iPhone app (launching on the App Store in late 2026). On launch day:
#   1. Paste the app's App Store link into `url` (keep the quotes). The
#      official "Download on the App Store" badge then appears first, next to
#      Google Play, everywhere on the site.
#   2. Update the two FAQ answers that say the iPhone app is coming soon.
# Until then, preview builds show the badge (not yet a link) and the live
# site shows the `comingSoon` line next to the Google Play badge.
appStore:
  url: null
  comingSoon: iPhone app coming soon

seo:
  title: "EzyAgric: Farm the Ezy way | Ka-Ezy, Agrishop, EzyCredits, Produce Market"
  description: "One farming app to plan, buy, pay and sell: ask Ka-Ezy, shop genuine inputs on Agrishop, pay with EzyCredits and list your harvest on Produce Market."
  googleSiteVerification: r4qhmGCvQpsFjly0EYIRXgCg0fNN_-WPCFf_4QI45I0

hero:
  eyebrow: Built for Africa's farmers
  headline: Farm the Ezy way.
  # Product names turn green on their own; ==phrase== gets a highlighter stroke.
  subline: "One app to ==plan, buy, pay, sell and manage your farm==. Ask your farm ==personalised expert== Ka-Ezy, shop your ==genuine agro-inputs== delivered at your ==door step== on Agrishop, ==Pay Later== for your products and services with EzyCredits and sell your ==farm produce== on Produce Market."
  screenshot:
    src: /images/screens/home.webp
    alt: "EzyAgric App home screen showing Agrishop, Ka-Ezy and Produce Market"
    width: 640
    height: 1385
  mascot:
    src: /images/products/ka-ezy-full.webp
    alt: Ka-Ezy, the EzyAgric farm expert, holding a phone with the EzyAgric App
    width: 640
    height: 1312

products:
  eyebrow: One app, four tools
  title: Everything your farm needs, in your pocket
  intro: "Get advice, buy inputs, pay your way and list your harvest for sale, all in the EzyAgric App."

journey:
  title: How the four tools work together
  intro: From planning your season to selling your harvest.
  steps:
    - verb: Plan
      product: ka-ezy
      text: Ask Ka-Ezy for advice and a farm plan for your land and budget.
    - verb: Buy
      product: agrishop
      text: Order genuine inputs and vet services on Agrishop.
    - verb: Pay
      product: ezycredits
      text: Pay now from your EzyCredits Wallet, or later with EzyCredits Pay Later (credit from Pezesha, if you qualify).
    - verb: Sell
      product: produce-market
      text: Post your harvest on Produce Market at your own asking price.

alsoInApp:
  title: Also in the app
  intro: Tools that help you run your farm like a business.
  # `visual` picks the small illustration on each tool's tile: records (a wide
  # tile), mapping (a tall one), calendar or guides. Leave it out for a plain tile.
  items:
    - title: Farm records
      text: Track your farm income and expenses to know if your farm is making a profit.
      icon: line-chart
      visual: records
    - title: Garden mapping
      text: Map your gardens. See their size and details with a Ka-Ezy plan.
      icon: map
      visual: mapping
    - title: Crop calendars
      text: Know what to do on your farm, and when.
      icon: calendar
      visual: calendar
    - title: Crop and animal guides
      text: Read practical information on the crops and animals you keep.
      icon: book-open
      visual: guides

