agents:
  eyebrow: Become a village agent
  title: Earn extra income as an EzyAgric agent
  intro: Village agents bring EzyAgric services to farmers in their area.
  steps:
    - Download the EzyAgric Agent app
    - Register with your phone number
    - The EzyAgric team contacts you to get you started
    - Get trained to deliver EzyAgric services in your area
  roles:
    - Register and profile farmers
    - Order and deliver agro-inputs
    - Give extension advice to farmer groups and cooperatives
    - Link farmers to markets
    - Appraise and follow up farmer credit
  cta:
    label: Get the Agent app
    campaign: agents
  image:
    src: /images/photos/village-agent.webp
    alt: An EzyAgric village agent with a farmer in a vegetable garden
    width: 900
    height: 675

faq:
  title: Questions farmers ask
  items:
    - q: Is the EzyAgric app free?
      a: "Yes. The app is free to download on Android from Google Play, and listing your produce on Produce Market is free. Ka-Ezy is free to try, then you choose a paid plan."
    - q: Where does EzyAgric work?
      a: "Shopping on Agrishop, EzyCredits Pay Later and selling on Produce Market are available in Uganda for now."
    - q: Can I use Ka-Ezy outside Uganda?
      a: "Yes. Ka-Ezy works wherever you can use the EzyAgric app."
      pending: true
      note: Confirm which countries to name (the app lists Uganda, Kenya, Tanzania, Rwanda, DR Congo and South Sudan).
    - q: How do I pay?
      a: "With MTN or Airtel Mobile Money, your EzyCredits Wallet, EzyCredits Pay Later, or cash when your order is delivered."
    - q: Is there an iPhone app?
      a: "Right now the EzyAgric app is available on Android from Google Play."
      pending: true
      note: Confirm iPhone status — App Store screenshots exist in the app project.
    - q: Can I get help from a person?
      a: "Yes. Chat with our team on WhatsApp or call us — see the contact details below."

