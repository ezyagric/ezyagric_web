# Site-wide copy for ezyagric.com.
#
# How to edit: change the text between quotes, keep the indentation.
# Mark anything not yet confirmed with `pending: true` and a `note`.
# Preview/staging builds show it with a "To confirm" badge; production
# builds hide it. Validated by src/lib/content.ts at build time.

# Visual theme from src/theme/themes.css: "ezyagric" (default) or
# "ezyagric-guide" (the Brand Guide's original blue and 8px buttons).
theme: ezyagric

name: EzyAgric
legalName: Akorion Company Limited
slogan: Farm the Ezy Way, the Smart Way.

# The Ka-Ezy banner, repeated at key points across the site (home page, every
# service page including Ka-Ezy's, the 404 page; a one-line strip in the
# menus) so visitors can watch, try, pay for and download Ka-Ezy from
# wherever they are. The "try" and "pay"
# links go to the Ka-Ezy page's "Work with Ka-Ezy, then hire it" section when the
# site shows it, else to the Ka-Ezy page and its plans.
kaezyBanner:
  eyebrow: Meet Ka-Ezy
  title: Your 24/7 farm expert, ready when you are
  intro: Watch Ka-Ezy at work, try it right here, pay with Mobile Money, or get the app.
  # The banner plays the Ka-Ezy demo video in place (the portrait video in
  # content/products/ka-ezy.yaml); this is the label above it.
  watch:
    title: See Ka-Ezy in action
  try:
    title: Try Ka-Ezy
    text: Share your crops or livestock with Ka-Ezy right here and see how it assists you.
    appText: Start free in the EzyAgric App. No payment needed.
  pay:
    title: Pay
    text: Hire Ka-Ezy for 1 month for UGX 5,000, or save with 3 or 6 months. Pay with MTN MoMo or Airtel Money.
    link: See plans
  app:
    title: Download the App
    text: Ka-Ezy lives in the EzyAgric App, free to download.
  strip:
    label: Ka-Ezy, your 24/7 farm expert
    watch: See Ka-Ezy in action
    try: Try Ka-Ezy
    pay: Pay for Ka-Ezy

# The iPhone app (with Apple for review, Oct 2026). On launch day:
#   1. Paste the app's App Store link into `url` (keep the quotes). The
#      "Download on the App Store" badge then opens the App Store, and its
#      popup goes, everywhere on the site.
#   2. Update the two FAQ answers that say the iPhone app is coming soon.
# Until then, tapping the badge opens a popup on every build: `comingSoon` is
# its headline (==marks== are highlighted), `popup` the line and button below.
appStore:
  url: null
  comingSoon: EzyAgric is ==coming soon== on iOS
  popup:
    note: Until then, you can get it on Android from Google Play.
    close: Got it

seo:
  title: "EzyAgric: Farm the Ezy Way, the Smart Way | Ka-Ezy, Agrishop, EzyCredits, Produce Market"
  description: "One app for farmers and agribusinesses: work with Ka-Ezy, shop genuine inputs on Agrishop, pay later with EzyCredits if you qualify, and sell crops on Produce Market."
  googleSiteVerification: r4qhmGCvQpsFjly0EYIRXgCg0fNN_-WPCFf_4QI45I0

hero:
  eyebrow: Built for Africa's farmers and agribusinesses
  headline: Farm the Ezy Way, the Smart Way.
  # Product names turn green on their own; ==phrase== gets a highlighter stroke.
  subline: "One app to ==plan, buy, pay, sell and manage your farm==. Work with your farm ==personalised expert== Ka-Ezy, shop your ==genuine agro-inputs== delivered at your ==door step== on Agrishop, ==Buy Now, Pay Later== for your products and services with EzyCredits if you qualify, and sell your ==crops and livestock== on Produce Market."
  screenshot:
    src: /images/screens/home.webp
    alt: "EzyAgric App home screen showing Agrishop, Ka-Ezy and Produce Market"
    width: 640
    height: 1385
  mascot:
    src: /images/products/ka-ezy-full.webp
    alt: Ka-Ezy, the EzyAgric farm expert, holding a phone with the EzyAgric App
    width: 640
    height: 1312

products:
  eyebrow: One app, four tools
  title: Everything your farm or agribusiness needs
  intro: "Get advice, buy inputs, pay your way and sell crops and livestock, all in the [EzyAgric App](get-app)."

journey:
  title: How the four tools work together
  intro: From planning your farm to selling your crops and livestock.
  # Real photos from the field, one per step (assets-src/photos-field).
  steps:
    - verb: Plan
      product: ka-ezy
      text: Share your crops, animals and budget with Ka-Ezy for advice and a farm plan.
      # Each step's next move: Ka-Ezy's demo, or the product's own button (its hero's label).
      action: { kind: ask-kaezy, label: Work with Ka-Ezy, appLabel: See Ka-Ezy plans }
      image:
        src: /images/photos/agent-shows-farmers-phone.webp
        alt: An EzyAgric field agent shows two young farmers something on her phone
        width: 1000
        height: 667
        focus: "50% 30%"
    - verb: Buy
      product: agrishop
      text: Order genuine inputs and vet products on Agrishop.
      action: { kind: get-app, label: Shop on Agrishop }
      image:
        src: /images/photos/agro-shop-product-check.webp
        alt: A young farmer in an agro-input shop checks a bottle of herbicide against his phone
        width: 1000
        height: 667
        focus: "55% 45%"
    - verb: Pay
      product: ezycredits
      text: Get your inputs now with EzyCredits Buy Now, Pay Later (if you qualify).
      action: { kind: get-app, label: See if you qualify }
      image:
        src: /images/photos/agro-dealer-phone.webp
        alt: An agro-input dealer at his counter with his phone, shelves of seed and crop protection products behind him
        width: 1000
        height: 667
        focus: "60% 50%"
    - verb: Sell
      product: produce-market
      text: Post your crops and livestock on Produce Market at your own asking price.
      action: { kind: get-app, label: List your produce }
      image:
        src: /images/photos/farmer-produce-sacks.webp
        alt: A smiling farmer beside a tall stack of produce sacks ready for market
        width: 1000
        height: 750
        focus: "65% 50%"

alsoInApp:
  title: Also in the app
  intro: Tools that help you run your farm like a business.
  # `visual` picks the small illustration on each tool's tile: records (a wide
  # tile), mapping (a tall one), calendar or guides. Leave it out for a plain tile.
  items:
    - title: Farm records
      text: Track your farm income and expenses to know if your farm is making a profit.
      icon: line-chart
      visual: records
    - title: Garden mapping
      text: Map your gardens. See their size and details with a Ka-Ezy plan.
      icon: map
      visual: mapping
    - title: Crop calendars
      text: Know what to do on your farm, and when.
      icon: calendar
      visual: calendar
    - title: Crop and animal guides
      text: Read practical information on the crops and animals you keep.
      icon: book-open
      visual: guides

# Livestock, told through a poultry farmer's story: "EzyAgric Poultry
# Video.mp4" from the marketing team's Website folder (Oct 2026), compressed
# to 720p (28 MB, plays only when tapped), with stills from it
# (assets-src/photos-poultry). Still to come from marketing: an English
# captions file, and a corrected export (the video's own caption misspells
# POULTRY). See the README launch checklist.
livestock:
  eyebrow: Livestock
  title: Livestock farming, the Ezy Way
  video:
    src: /videos/poultry-marvin-busulwa.mp4
    title: Marvin Busulwa, poultry farmer, on the EzyAgric App
    poster: { src: /images/photos/poultry-app-among-hens.webp, alt: "", width: 1400, height: 788 }
  # One tile each, under the product's name, linking to its page; so the
  # text does not name the product again.
  points:
    - product: ka-ezy
      text: Advice on feeding and vaccination, and a photo check of sick animals.
    - product: agrishop
      text: Day-old chicks, feeds and vet products, delivered near you.
    - product: ezycredits
      text: Get feeds and vet products now and pay later, if you qualify.
    - product: produce-market
      text: Sell animals, birds and eggs at your own price.
  # Stills from the video, in a row under it.
  photos:
    - src: /images/photos/poultry-eggs-tray.webp
      alt: Marvin Busulwa smiles as he holds up a full tray of eggs in his poultry house
      width: 600
      height: 810
      focus: "50% 5%"
    - src: /images/photos/poultry-feeding-time.webp
      alt: A woman pours feed into a hanging feeder among hundreds of brown layers
      width: 800
      height: 450
      focus: "55% 50%"
    - src: /images/photos/poultry-kaezy-photo-check.webp
      alt: A phone held among the birds shows Ka-Ezy checking a photo of a hen
      width: 800
      height: 450
      focus: "45% 40%"
    - src: /images/photos/poultry-layers-feeder.webp
      alt: Brown layers crowd round an orange feeder in the poultry house
      width: 800
      height: 450

# Figures from the EzyAgric Business Profile 2026 (October 2026). The team
# asked (26 Oct 2026) to show only the reach and jobs figures, without dates
# or sources, and to fold "across Uganda" into the reach figure.
impact:
  title: Our impact
  image:
    src: /images/photos/farmer-with-phone.webp
    alt: A young Ugandan farmer smiling and holding his phone with the EzyAgric App
    width: 720
    height: 1280
    focus: "50% 30%"
  # Beside the first photo, a mosaic of farmers from EzyAgric's own field
  # photos (assets-src/photos-field).
  gallery:
    - src: /images/photos/farmers-sorting-maize.webp
      # The narrow cells from sm up show only the woman in front, so the alt
      # text holds for every crop.
      alt: A woman farmer sorts a large pile of harvested maize cobs
      width: 640
      height: 480
      focus: "52% 40%"
    - src: /images/photos/farmer-coffee-cherries.webp
      alt: A coffee farmer smiling and holding out a handful of ripe red coffee cherries
      width: 600
      height: 903
      # High, so his face stays in the near-square crop on phones.
      focus: "50% 10%"
  items:
    # 500,000 plus EzyCRM's total awareness, 54,662 on 16 Sep 2026 (54,491
    # people who signed up and verified their phone, plus 171 EzyProduce
    # organisations). Typed by hand: update it from the CRM's Awareness card
    # until the live count below is switched on.
    - value: 554662
      suffix: "+"
      # "reached", not "served": the live figure is EzyCRM's total awareness
      # (the team's call, 29 Oct 2026).
      label: Farmers and agribusinesses reached across Uganda
      # Live where the build sets NEXT_PUBLIC_IMPACT_API: 500,000 plus EzyCRM's
      # total awareness count, refreshed every five minutes
      # (docs/backend-tickets.md BT-10). The typed number above shows first, and
      # stays if the count can't be had.
      live: { base: 500000 }
    - value: 12500
      label: Full and part-time jobs created
  evidence:
    title: What farmers and agribusinesses report
    # Studies behind these figures (not shown on the site): the 60 Decibels
    # impact audit (86%, 88%) and a 2025 impact assessment in West Nile
    # refugee settlements (85%).
    items:
      - value: 86%
        label: of farmers report increased production
      - value: 88%
        label: of agribusinesses say their way of doing business has improved
      - value: 85%
        label: of farmers report higher income

